<!DOCTYPE html>
<html lang="en">
  <head>
    <title>What is your email address? – Apply for a permit – GOV.UK</title>
  </head>
  <body>
    <a href="#main-content" class="govuk-skip-link">Skip to main content</a>
    <a href="/start" class="govuk-back-link">Back</a>
    <main id="main-content" class="govuk-main-wrapper">
      <div class="govuk-width-container">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">
            <form method="post" novalidate>
              <div class="govuk-form-group govuk-form-group--error">
                <h1 class="govuk-label-wrapper">
                  <label class="govuk-label govuk-label--l" for="email">What is your email address?</label>
                </h1>
                <input class="govuk-input govuk-input--error" id="email" name="email" type="email" autocomplete="email" spellcheck="false">
              </div>
              <button class="govuk-button" type="submit">Continue</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
