<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Do you have a UK passport? – Apply for a permit – GOV.UK</title>
  </head>
  <body>
    <a href="#main-content" class="govuk-skip-link">Skip to main content</a>
    <a href="/start" class="govuk-back-link">Back</a>
    <main id="main-content" class="govuk-main-wrapper">
      <div class="govuk-width-container">
        <div class="govuk-grid-row">
          <div class="govuk-grid-column-two-thirds">
            <h1 class="govuk-heading-l">Question</h1>
            <form method="post" novalidate>
              <h2 class="govuk-heading-m">Do you have a UK passport?</h2>
              <div class="govuk-radios">
                <div class="govuk-radios__item">
                  <input class="govuk-radios__input" id="yes" name="passport" type="radio" value="yes">
                  <label class="govuk-label govuk-radios__label" for="yes">Yes</label>
                </div>
                <div class="govuk-radios__item">
                  <input class="govuk-radios__input" id="no" name="passport" type="radio" value="no">
                  <label class="govuk-label govuk-radios__label" for="no">No</label>
                </div>
              </div>
              <button class="govuk-button" type="submit">Continue</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
